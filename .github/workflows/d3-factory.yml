name: D3 Factory

on:
  # Primary trigger: Slack → webhook → repository_dispatch
  repository_dispatch:
    types: [d3-run]
  # Fallback for testing WITHOUT Slack: run manually from the Actions tab
  workflow_dispatch:
    inputs:
      brief:
        description: "what to build"
        required: true

# There is deliberately no deploy job. The deploy gate is: a human reviews the
# factory PR and merges to main, and Vercel auto-deploys main (see CLAUDE.md).
jobs:
  pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # reviewer needs history for git diff main...HEAD
          # Don't leave the write-scoped GITHUB_TOKEN in .git/config where a
          # prompt-injected agent could read it. The push step below supplies it
          # explicitly, after the agents have finished.
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22" # same as ci.yml
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      # Factory infra is self-contained in scripts/ with its own package.json and
      # lockfile, so the app's dependencies are never touched.
      - name: Install factory dependencies (clean, from lockfile)
        working-directory: scripts
        run: npm ci

      - name: Create working branch
        run: |
          BR="factory/run-${{ github.run_id }}"
          git checkout -b "$BR"
          git config user.name "d3-factory"
          git config user.email "factory@phoresight.io"
          echo "BRANCH=$BR" >> "$GITHUB_ENV"

      - name: Run pipeline (Planner → Coder → Tester → Reviewer)
        working-directory: scripts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          BRIEF: ${{ github.event.client_payload.brief || inputs.brief }}
          SLACK_CHANNEL: ${{ github.event.client_payload.channel }}
          SLACK_USER: ${{ github.event.client_payload.user }}
          RUN_LOG_SHEET_WEBHOOK: ${{ secrets.RUN_LOG_SHEET_WEBHOOK }}
        run: node d3-orchestrator.mjs

      - name: Commit run log + any factory artifacts meant to persist
        run: |
          git add -A
          git commit -m "factory run ${{ github.run_id }}" || echo "nothing to commit"

      # KNOWN FOLLOW-UP: PRs opened with the default GITHUB_TOKEN do not trigger
      # other workflows, so claude-review.yml and ci.yml will NOT run on factory PRs.
      # Fixing that needs a PAT or GitHub App token here, plus the repo setting
      # "Allow GitHub Actions to create and approve pull requests". Not wired yet.
      # This step holds a write token, and the agents could have planted anything in
      # the workspace (scripts, .git/hooks, .git/config). So it runs NO repo code and
      # never lets the workspace repo's hooks/config execute with the token present:
      # the branch is pushed from a fresh, empty repo that only receives the commits
      # (objects) from the workspace, and Slack is posted with plain curl + jq.
      - name: Open PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ github.event.client_payload.channel }}
          BRIEF: ${{ github.event.client_payload.brief || inputs.brief }}
        run: |
          CLEAN="$(mktemp -d)"
          git init -q "$CLEAN"
          git -C "$CLEAN" fetch -q --no-tags "$GITHUB_WORKSPACE" "refs/heads/$BRANCH:refs/heads/$BRANCH"
          git -C "$CLEAN" remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -C "$CLEAN" -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" \
            push -u origin "$BRANCH"
          # No `|| true`: if PR creation fails, the run fails. Explicit title/body
          # (not --fill) so gh never reads the workspace repo; run from the clean dir.
          PR_URL="$(cd "$CLEAN" && gh pr create --repo "$GITHUB_REPOSITORY" \
            --head "$BRANCH" --base main \
            --title "Factory: $(printf %s "$BRIEF" | tr '\n' ' ' | cut -c1-70)" \
            --body "Opened by D3 Factory run ${{ github.run_id }}.

          Brief: ${BRIEF}

          Review the diff, then merge to main to deploy (Vercel auto-deploys main).")"
          echo "Opened $PR_URL"
          # Best-effort Slack notice with the real PR link (never fails the run).
          if [ -n "$SLACK_BOT_TOKEN" ] && [ -n "$SLACK_CHANNEL" ]; then
            curl -s -X POST https://slack.com/api/chat.postMessage \
              -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
              -H "Content-Type: application/json; charset=utf-8" \
              -d "$(jq -n --arg c "$SLACK_CHANNEL" \
                     --arg t "🔀 PR opened for review: $PR_URL — merge it to main to deploy (Vercel auto-deploys main)." \
                     '{channel:$c, text:$t}')" || true
          fi
