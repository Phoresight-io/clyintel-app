name: D3 Review Dispatch

# On-demand PR review requested from Slack via `/d3-review <PR number>`:
#   Slack → slack-dispatch (slack-command.js) → repository_dispatch(d3-review) → this workflow.
#
# Separate from claude-review.yml ON PURPOSE: that workflow gates off
# github.event.pull_request.* (draft / fork / dependabot), which is EMPTY under
# repository_dispatch, so it cannot serve this trigger — and it must stay untouched.
# This runs the SAME review step, but on the capped, dedicated factory key
# (D3_FACTORY_ANTHROPIC_API_KEY, no fallback to the shared ANTHROPIC_API_KEY), and
# mirrors the verdict back to the Slack channel the request came from.
#
# SECURITY (pwn-request). repository_dispatch runs on the DEFAULT BRANCH with repo
# secrets and a write token in scope. BEFORE any PR code is checked out, the gate step
# refuses a PR whose head is a fork / cross-repo (head.repo != base.repo) or that is not
# open, so untrusted head code never executes while the secrets are reachable.
on:
  repository_dispatch:
    types: [d3-review]

concurrency:
  group: d3-review-${{ github.event.client_payload.pr }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20 # a stuck review must not keep spending on the API key for GitHub's 6h default
    permissions:
      contents: read # read the code
      pull-requests: write # post review comments
      # id-token not needed — github_token below bypasses the action's OIDC app-token exchange
    steps:
      # Resolve the PR with ONE API read and decide whether it is safe to review, BEFORE any PR
      # code is on disk. A fork / cross-repo head or a non-open PR is refused and the job exits
      # cleanly (not a red failure); the Notify Slack step reports the refusal.
      - name: Resolve the PR and gate forks / non-open PRs
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.client_payload.pr }}
        run: |
          # The Slack endpoint already validated /^\d+$/, but this is the gate for a privileged,
          # secret-bearing run, so re-check the number here before it reaches the GitHub API.
          case "$PR" in
            ''|*[!0-9]*) echo "client_payload.pr is not a bare number; refusing." >&2; exit 1 ;;
          esac
          # isCrossRepository is exactly head.repo.full_name != base.repo.full_name (and is true
          # when the head repo was deleted); state gates non-open PRs. No PR code is touched yet.
          META="$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json state,isCrossRepository,headRefOid)"
          STATE="$(printf '%s' "$META" | jq -r '.state')"
          CROSS="$(printf '%s' "$META" | jq -r '.isCrossRepository')"
          HEAD_SHA="$(printf '%s' "$META" | jq -r '.headRefOid')"
          if [ "$CROSS" != "false" ]; then
            echo "PR #$PR head is a fork / another repo; refusing to check it out with secrets in scope."
            echo "refuse=fork" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$STATE" != "OPEN" ]; then
            echo "PR #$PR is not open (state $STATE); nothing to review."
            echo "refuse=state" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$HEAD_SHA" in
            *[!0-9a-f]*|'') echo "Could not resolve PR #$PR head SHA; refusing." >&2; exit 1 ;;
          esac
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "ok=true" >> "$GITHUB_OUTPUT"

      # Only now, after the gate passed, check out the PR head commit.
      - name: Check out the PR head
        if: ${{ steps.gate.outputs.ok == 'true' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.gate.outputs.head_sha }}
          fetch-depth: 1
          # claude-code-action sets up its own git auth from github_token below, so don't
          # also leave the token in .git/config for anything in this job to read.
          persist-credentials: false

      - name: Review
        if: ${{ steps.gate.outputs.ok == 'true' }}
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.D3_FACTORY_ANTHROPIC_API_KEY }}
          # Use the workflow token directly; without this the action tries OIDC
          # (needs id-token: write + the Claude GitHub App installed) and fails.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Model intentionally unpinned (action default); re-pin once a model ID is confirmed.
          claude_args: >-
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.client_payload.pr }}

            You are reviewing a pull request for Clyintel — an AI-powered
            accounts-receivable / revenue-recovery product on Next.js +
            TypeScript + Supabase, deployed on Vercel. It handles customer
            financial data, so data exposure is high severity.

            Review the diff and leave feedback. Priorities, in order:
            1. SECURITY — secrets committed, SQL/injection, auth bypass, unsafe
               Supabase RLS assumptions, unvalidated user-facing input, any path
               that could leak one customer's financial/AR data to another.
            2. PROD-SAFETY — DB migrations, Vercel config, or Stripe writes that
               look risky or unflagged. Call these out explicitly.
            3. CORRECTNESS — bugs, broken types, missing error handling, async
               mistakes.
            4. SCOPE & QUALITY — dead code, needless complexity. Don't nitpick
               style a linter catches.

            How to respond:
            - Leave INLINE comments on specific lines via
              mcp__github_inline_comment__create_inline_comment for concrete issues.
            - Post ONE top-level summary comment via `gh pr comment` with an
              overall read and a plain verdict line:
              "Review: looks good" / "Review: changes suggested" /
              "Review: do not merge (security/prod risk)".
            - You are advisory only. DO NOT approve or request-changes as a formal
              GitHub review, and never merge. The human decides the merge.
            - If the diff is clean, say so briefly. Don't invent problems.

      # Mirror the outcome back to the Slack channel the request came from, using the same
      # mechanism the factory uses: SLACK_BOT_TOKEN, chat.postMessage, the payload built by jq
      # and read by curl from stdin (no text reaches a shell string or a curl argument), previews
      # off. There is no originating thread (the slash command opens no start message), so this
      # posts to the channel directly. Non-fatal: a missing token/channel just skips it.
      - name: Notify Slack
        if: ${{ always() }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ github.event.client_payload.channel || vars.D3_DEFAULT_CHANNEL }}
          SLACK_USER: ${{ github.event.client_payload.user }} # a Slack user id for the tag, not a secret
          PR: ${{ github.event.client_payload.pr }}
          PR_URL: ${{ github.server_url }}/${{ github.repository }}/pull/${{ github.event.client_payload.pr }}
          REFUSE: ${{ steps.gate.outputs.refuse }}
          GATE_OK: ${{ steps.gate.outputs.ok }}
          REVIEW_STATUS: ${{ job.status }}
          THREAD_TS: ${{ github.event.client_payload.thread_ts }} # set by the emoji path; empty for the slash command
        run: |
          if [ -z "$SLACK_BOT_TOKEN" ] || [ -z "$SLACK_CHANNEL" ]; then
            echo "No Slack token/channel configured; nothing to notify."
            exit 0
          fi
          # Slack failures are reported, never fatal: $1 is curl's exit status, $2 Slack's response. Prints one
          # fixed-format line when the post did not succeed, with Slack's .error only if it looks like an error
          # code ([a-z_], at most 64 characters; anything else is "unknown"). Never prints the response body, the
          # token or the message text. Always returns 0, so no job fails because of Slack.
          slack_report() {
            local err
            if [ "$1" != "0" ]; then echo "Slack post failed: curl_failed"; return 0; fi
            if printf '%s' "$2" | jq -e '.ok == true' >/dev/null 2>&1; then return 0; fi
            err="$(printf '%s' "$2" | jq -r '(.error // empty) | strings | select(length >= 1 and length <= 64 and (explode | all(. == 95 or (. >= 97 and . <= 122))))' 2>/dev/null || true)"
            if [[ ! "$err" =~ ^[a-z_]{1,64}$ ]]; then err="unknown"; fi
            echo "Slack post failed: $err"
            return 0
          }
          # Tag the requester only if the id looks like one Slack issues.
          TAG=""
          if [[ "$SLACK_USER" =~ ^[UW][A-Z0-9]{2,}$ ]]; then TAG="<@$SLACK_USER> "; fi
          # Reply in the originating thread (emoji path) only when the ts looks like one Slack issues;
          # the slash command sends none, so this stays empty and the post goes to the channel as before.
          THREAD=""
          if [[ "$THREAD_TS" =~ ^[0-9]{1,12}\.[0-9]{1,8}$ ]]; then THREAD="$THREAD_TS"; fi
          if [ "$REFUSE" = "fork" ]; then
            MSG="⛔ /d3-review PR #$PR refused: the PR head is a fork / another repo, so it is not reviewed with secrets in scope."
          elif [ "$REFUSE" = "state" ]; then
            MSG="ℹ️ /d3-review PR #$PR: the PR is not open, so there is nothing to review."
          elif [ "$GATE_OK" != "true" ]; then
            MSG="❌ /d3-review PR #$PR could not start (the PR could not be resolved). See the Actions run."
          else
            MSG="🔍 /d3-review PR #$PR finished ($REVIEW_STATUS): $PR_URL (see the PR comments for the verdict)."
          fi
          RESP="$(jq -n --arg c "$SLACK_CHANNEL" --arg t "${TAG}${MSG}" --arg ts "$THREAD" \
            '{channel:$c, text:$t, unfurl_links:false, unfurl_media:false} + (if $ts != "" then {thread_ts:$ts} else {} end)' \
            | curl -s -m 15 -X POST https://slack.com/api/chat.postMessage \
                -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
                -H "Content-Type: application/json; charset=utf-8" \
                --data @-)" && CURL_RC=0 || CURL_RC=$?
          slack_report "$CURL_RC" "$RESP"
