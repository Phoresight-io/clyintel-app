name: D3 Factory

on:
  # Primary trigger: Slack → webhook → repository_dispatch
  repository_dispatch:
    types: [d3-run]
  # Fallback for testing WITHOUT Slack: run manually from the Actions tab
  workflow_dispatch:
    inputs:
      brief:
        description: "what to build"
        required: true

# There is deliberately no deploy job. The factory branches from DEVELOP and opens its PR
# against develop. The deploy flow: a human reviews the factory PR and merges it to develop,
# Vercel deploys develop to develop.clyintel (dev), and develop is later promoted to main,
# which Vercel deploys to production. This workflow file itself runs from main (dispatch
# workflows run from the default branch, and the kill switch below requires it); only the
# code the agents work on comes from develop.
#
# Separate jobs on purpose. Every step in a job shares $GITHUB_ENV and $GITHUB_PATH, so
# an agent with Bash (e.g. after a prompt injection) could poison PATH or BASH_ENV
# for every later step in ITS job. So the job that runs agents has NO write token,
# and the job that has one (publish) never executes anything the agents wrote: it
# only receives their commits as a git bundle, which carries objects, not hooks,
# config or scripts.
#
# SECRETS. The job that holds secrets never runs agents; the job that runs agents holds exactly
# one secret. A process on a runner can read every secret its job was given (the coder's Bash ran
# as the runner user and could read them all via /proc), so:
#   - pipeline (runs agents) references ONE secret, D3_FACTORY_ANTHROPIC_API_KEY, and the agents
#     run in a container that sees only the repo checkout and that key. The commit/bundle step,
#     which runs git on the tree the agents controlled, runs in a second container with no secret
#     and no network.
#   - notify-start, publish and notify-failure hold the Slack token and the run-log Sheet webhook
#     (and publish the write token). None of them executes anything the agents wrote.
# The key the agents get is spend-capped and dedicated; there is no fallback to the shared
# ANTHROPIC_API_KEY that PR review uses.
jobs:
  # Resolves the base branch (develop) to ONE commit, in a job that runs no agent code, so the
  # agent job and the publish job build on and compare against the exact same commit even if
  # develop moves in between. Both read it from here, never from anything an agent produced.
  prepare:
    if: ${{ vars.D3_FACTORY_ENABLED == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      base_sha: ${{ steps.base.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          persist-credentials: false

      - name: Resolve the base commit
        id: base
        run: |
          SHA="$(git rev-parse HEAD)"
          case "$SHA" in
            *[!0-9a-f]*|"") echo "Could not resolve develop to a commit." >&2; exit 1 ;;
          esac
          [ "${#SHA}" -eq 40 ] || { echo "Could not resolve develop to a commit." >&2; exit 1; }
          echo "Factory base: develop at $SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

  # Tells Slack the run started. This used to be posted by the orchestrator, which put the Slack
  # token into the job that runs agents. Runs no agent code; holds the Slack token and nothing else.
  notify-start:
    needs: prepare
    if: ${{ vars.D3_FACTORY_ENABLED == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Tell Slack the run started
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ github.event.client_payload.channel }}
          BRIEF: ${{ github.event.client_payload.brief || inputs.brief }}
        run: |
          if [ -z "$SLACK_BOT_TOKEN" ] || [ -z "$SLACK_CHANNEL" ]; then
            echo "No Slack token/channel configured; nothing to notify."
            exit 0
          fi
          # The brief is user text: escape Slack's control characters so it cannot render
          # <!channel> pings or <url|label> links.
          curl -s -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "$(jq -n --arg c "$SLACK_CHANNEL" --arg b "$BRIEF" \
                   '{channel:$c, text:("▶️ Design → build → test → review: " + ($b | gsub("&";"&amp;") | gsub("<";"&lt;") | gsub(">";"&gt;")))}')" || true

  pipeline:
    needs: prepare
    # KILL SWITCH: merging this workflow does not arm it. It runs only when the repository
    # variable D3_FACTORY_ENABLED is exactly "true" (Settings -> Secrets and variables ->
    # Actions -> Variables). With it unset, a run is skipped (publish is skipped too, as it
    # needs this job) and notify-failure tells Slack so.
    # Vercel previews: pushing factory/run-* would make Vercel build a preview of unreviewed
    # agent code with the Preview environment's variables. clyintel/vercel.json (the projects'
    # Root Directory; the repo-root vercel.json carries the same rule) turns Git deployments
    # off for factory/** (git.deploymentEnabled), and publish's PROTECTED list refuses any run
    # that changes a vercel.json, so an agent cannot switch them back on.
    if: ${{ vars.D3_FACTORY_ENABLED == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    # A stuck run must not burn API spend for GitHub's 6h default, and /d3 calls
    # don't run in parallel. Note this is not a FIFO queue: GitHub keeps at most ONE
    # pending run per group and cancels an older pending run when a newer one
    # arrives, so rapid /d3 calls can be dropped.
    timeout-minutes: 60
    concurrency:
      group: d3-factory
      cancel-in-progress: false
    permissions:
      contents: read # no write token in the job that runs agents
    env:
      # The agent sandbox image, pinned by digest (node 22 on Debian bookworm, which ships git).
      # To update: take the new index digest for node:22-bookworm from
      # https://github.com/docker-library/repo-info/blob/master/repos/node/remote/22-bookworm.md
      AGENT_IMAGE: node:22-bookworm@sha256:363e1587494626837fa7f9a23bdb453d13b0ff3c67c705c2805cfc69c2d2fad7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.base_sha }} # develop, as resolved by the prepare job
          fetch-depth: 0 # reviewer needs history for git diff <base>...HEAD
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22" # same as ci.yml
          # No npm cache on purpose: this job runs agents with shell access on the default
          # branch, and a cache saved after they ran could be restored by other workflows.

      # The agents never touch the checkout: they get a COPY, outside $GITHUB_WORKSPACE, and only that
      # copy is mounted into their container. actions/checkout's post-job step runs git in the
      # workspace on the runner, and git runs programs named in .git/config (core.fsmonitor), so a
      # workspace the agents had written to would let them run code on the host after they finished.
      # The copy is made here, before any agent runs, so it starts identical to the checkout.
      - name: Copy the repo for the agents
        run: |
          AGENT_REPO="$RUNNER_TEMP/d3-agent-repo"
          rm -rf "$AGENT_REPO" && mkdir -p "$AGENT_REPO"
          cp -a "$GITHUB_WORKSPACE/." "$AGENT_REPO/"

      # Factory infra is self-contained in scripts/ with its own package.json and
      # lockfile, so the app's dependencies are never touched.
      - name: Install factory dependencies (clean, from lockfile)
        run: cd "$RUNNER_TEMP/d3-agent-repo/scripts" && npm ci

      # The tester has to run the app's own suite (vitest, tsc), so install the app's dependencies
      # before any agent runs. This is the trusted base commit's lockfile, installed by us, not by an
      # agent. --ignore-scripts: dependency lifecycle scripts would run here with the runner's
      # environment, and vitest/tsc do not need them. The orchestrator refuses to start without it.
      - name: Install the app's dependencies (clean, from lockfile, no install scripts)
        run: cd "$RUNNER_TEMP/d3-agent-repo/clyintel" && npm ci --ignore-scripts --no-audit --no-fund

      - name: Create working branch
        working-directory: ${{ runner.temp }}/d3-agent-repo
        run: |
          BR="factory/run-${{ github.run_id }}"
          git checkout -b "$BR"
          git config user.name "d3-factory"
          git config user.email "factory@phoresight.io"

      # The containers run as the runner's uid (so the copy stays the runner's files), which the image's
      # /etc/passwd does not know; tools that look up the current user (os.userInfo(), git, npm) fail
      # without an entry. Give it one: the image's own passwd/group plus that uid, mounted read-only.
      # Also pulls the pinned image before any agent runs.
      - name: Prepare the agent container's user entry
        run: |
          ETC="$RUNNER_TEMP/d3-etc"
          rm -rf "$ETC" && mkdir -p "$ETC"
          docker run --rm --network none "$AGENT_IMAGE" cat /etc/passwd > "$ETC/passwd"
          docker run --rm --network none "$AGENT_IMAGE" cat /etc/group > "$ETC/group"
          U="$(id -u)"; G="$(id -g)"
          grep -q "^[^:]*:[^:]*:$U:" "$ETC/passwd" || echo "d3agent:x:$U:$G:d3 factory agents:/tmp:/bin/bash" >> "$ETC/passwd"
          grep -q "^[^:]*:[^:]*:$G:" "$ETC/group" || echo "d3agent:x:$G:" >> "$ETC/group"
          chmod 0444 "$ETC/passwd" "$ETC/group"

      # THE AGENT CONTAINER. The orchestrator and every agent session it starts run here, never on
      # the runner itself. What the agents can reach:
      #   - files: only the agents' copy of the repo (read-write at /work/repo; the coder commits there),
      #     a private tmpfs at /tmp, the passwd/group files above (read-only), and the image's own
      #     read-only filesystem. Not the checkout in $GITHUB_WORKSPACE, the runner's home, the rest of
      #     $RUNNER_TEMP (where $GITHUB_ENV/$GITHUB_PATH live), or the Docker socket.
      #   - processes: only their own (separate PID namespace), so /proc shows no runner process.
      #   - environment: exactly the variables listed below. The only secret is
      #     D3_FACTORY_ANTHROPIC_API_KEY, passed by NAME (-e VAR), so its value is never on a command
      #     line. No GITHUB_TOKEN, no ACTIONS_* runtime tokens, no Slack token, no Sheet webhook.
      #   - privileges: the runner's own non-root uid (so the files it writes stay the runner's),
      #     no capabilities, no setuid escalation, read-only root filesystem.
      #   - network: open (the sessions call the Anthropic API). An injected agent can therefore send
      #     out what it can read: the repo and the spend-capped key. Rotate the key if in doubt.
      # The orchestrator refuses to start without D3_FACTORY_SANDBOX=container, or if any other
      # credential-like variable is set (agent-env.mjs), so moving this step back onto the runner fails.
      # The container is named so the cleanup step can kill it: cancelling a run or hitting the job
      # timeout only kills the `docker run` client, and the container would keep running (and spending).
      - name: Run pipeline in the agent container (Planner → Coder → Tester → Reviewer)
        env:
          D3_FACTORY_ANTHROPIC_API_KEY: ${{ secrets.D3_FACTORY_ANTHROPIC_API_KEY }}
          BRIEF: ${{ github.event.client_payload.brief || inputs.brief }}
          SLACK_USER: ${{ github.event.client_payload.user }} # a Slack user id for the run record, not a secret
          BRANCH: factory/run-${{ github.run_id }}
        run: |
          # The dedicated key is mandatory: no fallback to ANTHROPIC_API_KEY. Fail before pulling anything.
          if [ -z "$(printf %s "$D3_FACTORY_ANTHROPIC_API_KEY" | tr -d '[:space:]')" ]; then
            echo "D3_FACTORY_ANTHROPIC_API_KEY is not set. The factory only runs on its dedicated, spend-capped key (there is no fallback to ANTHROPIC_API_KEY)." >&2
            exit 1
          fi
          docker run --rm --init --name "d3-agents-$GITHUB_RUN_ID" \
            --user "$(id -u):$(id -g)" \
            --cap-drop ALL --security-opt no-new-privileges \
            --read-only --tmpfs /tmp:rw,exec,nosuid,nodev,size=2g \
            --pids-limit 4096 \
            --network bridge \
            -v "$RUNNER_TEMP/d3-agent-repo:/work/repo" \
            -v "$RUNNER_TEMP/d3-etc/passwd:/etc/passwd:ro" -v "$RUNNER_TEMP/d3-etc/group:/etc/group:ro" \
            --workdir /work/repo/scripts \
            -e D3_FACTORY_SANDBOX=container \
            -e HOME=/tmp -e TMPDIR=/tmp -e CI=true -e LANG=C.UTF-8 \
            -e D3_FACTORY_ANTHROPIC_API_KEY \
            -e BRIEF -e SLACK_USER -e BRANCH \
            -e GITHUB_RUN_ID -e GITHUB_REPOSITORY -e GITHUB_ACTOR \
            "$AGENT_IMAGE" node d3-orchestrator.mjs

      # git runs on the tree the agents controlled, and git config/attributes there can make git run
      # programs (fsmonitor, clean filters). So this runs in a container too, with NO secret and NO
      # network: whatever an agent planted runs where there is nothing to steal and nowhere to send
      # it, and can only produce a bad bundle, which the publish job validates anyway. The script is
      # passed by name (COMMIT_AND_BUNDLE) so it is never interpolated into a shell. The branch name
      # and base commit come from the workflow, never from anything an agent wrote.
      - name: Commit and bundle the agents' work (container, no secrets, no network)
        env:
          RUN_ID: ${{ github.run_id }}
          BASE_SHA: ${{ needs.prepare.outputs.base_sha }} # develop, as resolved by the prepare job
          BUNDLE_OUT: /out
          COMMIT_AND_BUNDLE: |
            git add -A
            git -c core.hooksPath=/dev/null commit -m "factory run $RUN_ID" || echo "nothing to commit"
            git bundle create "$BUNDLE_OUT/factory.bundle" "factory/run-$RUN_ID" "^$BASE_SHA"
        run: |
          OUT="$RUNNER_TEMP/bundle-out"
          rm -rf "$OUT" && mkdir -p "$OUT"
          docker run --rm --init --name "d3-commit-$GITHUB_RUN_ID" \
            --user "$(id -u):$(id -g)" \
            --cap-drop ALL --security-opt no-new-privileges \
            --read-only --tmpfs /tmp:rw,nosuid,nodev,size=256m \
            --network none \
            -v "$RUNNER_TEMP/d3-agent-repo:/work/repo" -v "$OUT:/out" \
            -v "$RUNNER_TEMP/d3-etc/passwd:/etc/passwd:ro" -v "$RUNNER_TEMP/d3-etc/group:/etc/group:ro" \
            --workdir /work/repo \
            -e HOME=/tmp -e RUN_ID -e BASE_SHA -e BUNDLE_OUT -e COMMIT_AND_BUNDLE \
            "$AGENT_IMAGE" bash -euo pipefail -c "$COMMIT_AND_BUNDLE"
          # Take the bundle only as a regular file (never through a link the container left) into a
          # path the container never saw.
          if [ ! -f "$OUT/factory.bundle" ] || [ -L "$OUT/factory.bundle" ]; then
            echo "The bundle step did not produce a regular file; refusing." >&2
            exit 1
          fi
          cp -- "$OUT/factory.bundle" "$RUNNER_TEMP/factory.bundle"

      - uses: actions/upload-artifact@v4
        with:
          name: factory-bundle
          path: ${{ runner.temp }}/factory.bundle
          if-no-files-found: error
          retention-days: 3

      # Always, including after a cancel or timeout: kill the containers first (a cancelled `docker run`
      # client leaves its container running), then delete the agents' copy. The coder can chmod
      # directories to make them undeletable, so restore owner permissions first (chmod -R does not
      # follow links), and fail loudly if anything is left. Nothing here runs git.
      - name: Remove the agents' containers and working tree
        if: always()
        run: |
          docker rm -f "d3-agents-$GITHUB_RUN_ID" "d3-commit-$GITHUB_RUN_ID" >/dev/null 2>&1 || true
          AGENT_REPO="$RUNNER_TEMP/d3-agent-repo"
          if [ -e "$AGENT_REPO" ]; then
            chmod -R u+rwX "$AGENT_REPO" 2>/dev/null || true
            rm -rf -- "$AGENT_REPO"
          fi
          if [ -e "$AGENT_REPO" ]; then
            echo "Could not remove the agents' working copy." >&2
            exit 1
          fi

  # KNOWN FOLLOW-UP: PRs opened with the default GITHUB_TOKEN do not trigger other
  # workflows, so ci.yml will NOT run on a factory PR (claude-review.yml does run once
  # a human marks it ready, because that is a user event). Fixing CI needs a PAT or
  # GitHub App token here, or `ready_for_review` in ci.yml's pull_request types. Not wired.
  # The repo setting "Allow GitHub Actions to create and approve pull requests" is
  # needed for `gh pr create` either way.
  publish:
    needs: [prepare, pipeline] # skipped if the pipeline failed, so a failed run opens no PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      # "true" once this run's validated record was sent to the Sheet, which happens only after
      # publish succeeded (PR opened, or the "no code changes" exit). Otherwise notify-failure
      # adds its own "run failed" row.
      sheet_logged: ${{ steps.push.outputs.sheet_logged }}
    steps:
      # Trusted checkout of the base commit (develop, as resolved by the prepare job) only.
      # Nothing the agents wrote is checked out or executed in this job.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: factory-bundle
          path: ${{ runner.temp }}/bundle

      - name: Push branch and open PR
        id: push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ github.event.client_payload.channel }}
          RUN_LOG_SHEET_WEBHOOK: ${{ secrets.RUN_LOG_SHEET_WEBHOOK }}
          BRIEF: ${{ github.event.client_payload.brief || inputs.brief }}
          BRANCH: factory/run-${{ github.run_id }}
          BASE_SHA: ${{ needs.prepare.outputs.base_sha }} # develop; set by the prepare job, never by an agent
        run: |
          BUNDLE="$RUNNER_TEMP/bundle/factory.bundle"
          git bundle verify "$BUNDLE"
          # The bundle is untrusted: accept exactly one ref, our branch.
          HEADS="$(git bundle list-heads "$BUNDLE" | awk '{print $2}')"
          if [ "$HEADS" != "refs/heads/$BRANCH" ]; then
            echo "Unexpected refs in bundle: $HEADS" >&2
            exit 1
          fi
          git fetch -q --no-tags "$BUNDLE" "refs/heads/$BRANCH:refs/heads/$BRANCH"
          # Push ONE commit holding exactly the tree checked below. A push uploads every
          # commit in the chain, so without this an agent could commit a credential (or a
          # protected file) and delete it in a later commit: the net diff passes every check
          # here and the secret still lands in the branch history on GitHub.
          TREE="$(git rev-parse "refs/heads/$BRANCH^{tree}")"
          # Everything that goes into the commit is fixed by the tree and the base commit (dates
          # come from the base commit), so re-running this job after a push that succeeded but a
          # later step failed rebuilds the SAME commit: the push is then a no-op instead of a
          # rejected non-fast-forward, and `gh pr create` can be retried.
          BASE_DATE="$(git show -s --format=%cI "$BASE_SHA")"
          SQUASHED="$(GIT_AUTHOR_NAME=d3-factory GIT_AUTHOR_EMAIL=d3-factory@users.noreply.github.com \
            GIT_COMMITTER_NAME=d3-factory GIT_COMMITTER_EMAIL=d3-factory@users.noreply.github.com \
            GIT_AUTHOR_DATE="$BASE_DATE" GIT_COMMITTER_DATE="$BASE_DATE" \
            git -c core.hooksPath=/dev/null commit-tree "$TREE" -p "$BASE_SHA" -m "Factory run ${{ github.run_id }}")"
          git update-ref "refs/heads/$BRANCH" "$SQUASHED"
          # The factory's commits must not touch the factory itself, the Slack endpoint, CI,
          # or anything that steers a Claude Code session (.claude/, any CLAUDE.md, git
          # attributes/ignore). The agent job's own tripwire only watches files on disk, and
          # a coder can commit a change and then restore the working tree. This is the
          # check that holds: it compares two commits in this trusted checkout, so it runs no
          # filters or drivers. -z so git does not quote unusual paths (a quoted name would
          # start with " and slip past the ^ anchors); --no-renames so moving a file out of a
          # protected directory still lists the old path.
          #
          # Also protected: the cross-tenant isolation tests (tenant-isolation*, agent-isolation*, any *isolation*.test.*) (weakening it would ship with a
          # "Tests: PASS" claim), and the build/deploy/data surface that a human must own:
          # vercel.json (it defines the every-minute QBO worker and settlement crons),
          # next.config.*, and schema/ (SQL migrations, which can include RLS policies). And
          # vitest.config.* (it decides whether tenant-isolation runs at all), env-config.test.ts (stops server secrets leaking to client bundles; gates live Stripe
          # charges) and test/stubs/ (aliased into every suite). And
          # .ai/ (the product constitution, schema detail, Stripe IDs and specs that
          # clyintel/CLAUDE.md tells every agent to read) and .mcp.json (registers MCP servers
          # for Claude sessions): changing either rewrites the rules agents work under.
          # Matched case-INSENSITIVELY (grep -i): the tree is checked on Linux, but a reviewer on a
          # case-insensitive checkout (macOS) would get `.Claude/settings.json` written into `.claude/`.
          PROTECTED='^(\.claude|\.github|scripts|api)/|^(\.gitignore|\.gitattributes)$|(^|/)(CLAUDE\.md|CLAUDE\.local\.md|\.gitattributes)$|(^|/)\.claude/|(^|/)(tenant|agent)-isolation[^/]*$|(^|/)[^/]*isolation[^/]*\.(test|spec)\.[cm]?[jt]sx?$|(^|/)env-config\.test\.[cm]?[jt]s$|^(clyintel/)?test/stubs/|(^|/)vercel\.(json|[cm]?[jt]s)$|(^|/)\.vercelignore$|(^|/)next\.config\.[cm]?[jt]s$|^(clyintel/)?schema/|(^|/)\.ai/|(^|/)\.mcp\.json$|(^|/)\.env($|\.)|(^|/)\.gitmodules$|(^|/)(\.husky|\.vscode|\.devcontainer)/|(^|/)(middleware|proxy)\.[cm]?[jt]s$|(^|/)\.npmrc$|(^|/)CODEOWNERS$|(^|/)vitest\.config\.[cm]?[jt]s$|(^|/)supabase/'
          CHANGED_FILES() { git diff --name-only -z --no-renames --no-ext-diff --no-textconv "$BASE_SHA" "refs/heads/$BRANCH"; }
          # Under .factory/ (only .factory/runs/ can get past .gitignore) the ONE file a run may add
          # is its own run record; anything else there would ride along into main.
          BAD="$( { CHANGED_FILES | { grep -izE "$PROTECTED" || true; }
                    CHANGED_FILES | { grep -izE '^\.factory/' || true; } | { grep -zvE "^\.factory/runs/run-${{ github.run_id }}\.json$" || true; }
                  } | tr '\0' '\n')"
          if [ -n "$BAD" ]; then
            echo "Factory commits touch protected paths; refusing to push:" >&2
            # Names come from the agent: indent them so none can start a line that the
            # runner would read as a workflow command (::add-mask::, ::stop-commands::, ...).
            printf '%s\n' "$BAD" | sed 's/^/    - /' >&2
            exit 1
          fi
          # The run record's PATH is allowed above, but its CONTENT is written by the agent job (a
          # `git add -A` after the agents finish), so it could hold anything, e.g. an env dump, that
          # would then sit in main's history behind a log file nobody reads. Refuse unless it is
          # exactly what run-log.mjs writes: one line of JSON, small, only the known keys, and only
          # short scalar values. `git show ref:path` prints the plain blob (no filters run).
          REC="$(git show "refs/heads/$BRANCH:.factory/runs/run-${{ github.run_id }}.json" 2>/dev/null || true)"
          REC_OK=""
          if [ -n "$REC" ]; then
            if [ "$(printf '%s\n' "$REC" | wc -l)" -ne 1 ] || [ "$(printf %s "$REC" | wc -c)" -gt 2048 ] \
               || ! printf %s "$REC" | jq -e '
                    type == "object"
                    and ((keys - ["ts","run_id","branch","actor","brief_sha256","brief_chars","plan_title","test_result","review_verdict","repo","num_turns","total_cost_usd","guard_denials"]) | length == 0)
                    and all(.[]; (type == "number") or (type == "string" and length <= 200))' >/dev/null 2>&1; then
              echo "Run record has unexpected content; refusing to push." >&2
              exit 1
            fi
            REC_OK=1
          fi
          # The record is now known to be exactly what run-log.mjs writes. It goes to the run-log
          # Sheet (best effort, never fails the run) only once publish has really succeeded: after
          # the PR is opened, or at the "no code changes" exit. Sending it any earlier would log a
          # run that a later step refuses (symlinks, the push, `gh pr create`) as the agents' own
          # PASS/APPROVE, and sheet_logged=true would then stop notify-failure adding its "run
          # failed" row. This used to happen in the agent job, which meant the webhook URL sat
          # where the agents could read it.
          #
          # Formula injection: plan_title (and any other string) comes from the agents, and a Sheet
          # evaluates a cell that starts with = + - @ (or a tab/CR before one) as a formula, e.g.
          # =HYPERLINK or =IMPORTXML that phones home. The record has already passed the flat-object
          # check above, so prefixing such strings with ' is enough; a clean record is sent unchanged,
          # byte for byte. The Apps Script should still write values as plain text.
          SHEET_REC="$REC"
          if [ -n "$REC_OK" ] && printf %s "$REC" | jq -e 'any(.[]; type == "string" and test("^[=+\\-@\t\r]"))' >/dev/null 2>&1; then
            SHEET_REC="$(printf %s "$REC" | jq -c --arg q "'" 'map_values(if type == "string" and test("^[=+\\-@\t\r]") then $q + . else . end)')"
          fi
          log_run_record() {
            if [ -n "$REC_OK" ] && [ -n "$RUN_LOG_SHEET_WEBHOOK" ]; then
              if curl -s -f -m 10 -X POST -H "Content-Type: application/json" --data-binary "$SHEET_REC" "$RUN_LOG_SHEET_WEBHOOK" >/dev/null; then
                echo "sheet_logged=true" >> "$GITHUB_OUTPUT"
              else
                echo "Run-log Sheet webhook did not accept the record (continuing)."
              fi
            fi
          }
          # Symlinks (120000) and submodules/gitlinks (160000) are refused outright: a feature
          # never needs one, and a symlink under e.g. clyintel/public/ pointing outside the repo
          # would be resolved by the Vercel preview build. Only the NEW mode is checked, so
          # deleting one is fine. (A path containing a newline can only cause a refusal here.)
          if git diff --raw --no-renames --no-ext-diff --no-textconv "$BASE_SHA" "refs/heads/$BRANCH" | awk '{print $2}' | grep -qE '^(120000|160000)$'; then
            echo "Factory commits add symlinks or submodules; refusing to push." >&2
            exit 1
          fi
          # A run that changed no code (only its own record) gets no PR: nothing to review, and a
          # PR holding just a log file is noise. Say so in Slack instead.
          if [ -z "$(CHANGED_FILES | tr '\0' '\n' | { grep -vE '^\.factory/runs/' || true; })" ]; then
            echo "Run changed no files outside .factory/runs/; not pushing and not opening a PR."
            if [ -n "$SLACK_BOT_TOKEN" ] && [ -n "$SLACK_CHANNEL" ]; then
              curl -s -X POST https://slack.com/api/chat.postMessage \
                -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
                -H "Content-Type: application/json; charset=utf-8" \
                -d "$(jq -n --arg c "$SLACK_CHANNEL" \
                       --arg t "ℹ️ Factory run ${{ github.run_id }} finished with no code changes; no PR opened." \
                       '{channel:$c, text:$t}')" || true
            fi
            log_run_record
            exit 0
          fi
          echo "What this run will push (each line prefixed with \"| \" so none can read as a workflow command):"
          git diff --stat=120 --no-ext-diff --no-textconv --no-renames "$BASE_SHA" "refs/heads/$BRANCH" | sed 's/^/    | /'
          echo "Review that list for anything that looks like data or a credential."
          # Not blocked (features legitimately change them) but flagged loudly in the PR body (including
          # billing/tenant-data code: CLAUDE.md rule 7 wants a human to confirm billing logic),
          # because a missed detail here costs the most: dependencies and the auth/tenant
          # middleware. Names come from the agent, so reduce them to a safe character set
          # (no backticks, so they cannot break out of the code fence) and cap the list.
          SENSITIVE='\.sql$|(^|/)(package(-lock)?\.json|tsconfig[^/]*\.json|\.gitignore)$|^(clyintel/)?lib/(settlement|revshare|ledgerSync|balanceEvents|recovery|qbo|providers|subscriber|outreach|config|contacts|capture|voice)/|^(clyintel/)?lib/(stripe[^/]*|supabase[^/]*|crypto|data|demo-mode|email|voice-calls|invoiceSources|adapters|validatePaymentLink)\.ts$|^clyintel/app/api/|(^|/)instrumentation\.[cm]?[jt]s$'
          WARN_FILES="$(CHANGED_FILES | { grep -izE "$SENSITIVE" || true; } | tr '\0' '\n' | tr -c 'A-Za-z0-9_./+@\n-' '?' | head -n 25)"
          WARN_NOTE=""
          if [ -n "$WARN_FILES" ]; then
            WARN_NOTE="$(printf '⚠️ Touches sensitive files (dependencies: check package.json for new install scripts such as postinstall/prepare; tsconfig paths, billing/settlement/Stripe/QBO code, inbound webhooks, tenant-data routes, Supabase clients, crypto, demo-mode switch, instrumentation, nested .gitignore). CLAUDE.md rule 7: billing or payment logic needs a human to confirm it. Review these carefully:\n\n```\n%s\n```' "$WARN_FILES")"
          fi
          # Weakened tests are easy to miss in a big diff: list EXISTING test files that were
          # modified or deleted (new ones are not flagged). Same sanitising as above.
          TEST_FILES="$(git diff --name-status -z --no-renames --no-ext-diff --no-textconv "$BASE_SHA" "refs/heads/$BRANCH" \
            | tr '\0' '\n' | awk 'NR%2==1{s=$0;next} s ~ /^[MD]$/ {print}' \
            | { grep -E '\.(test|spec)\.[cm]?[jt]sx?$' || true; } | tr -c 'A-Za-z0-9_./+@\n-' '?' | head -n 15)"
          if [ -n "$TEST_FILES" ]; then
            TEST_NOTE="$(printf '⚠️ Modifies or deletes existing tests. Check that no assertion was weakened:\n\n```\n%s\n```' "$TEST_FILES")"
            if [ -n "$WARN_NOTE" ]; then
              WARN_NOTE="$(printf '%s\n\n%s' "$WARN_NOTE" "$TEST_NOTE")"
            else
              WARN_NOTE="$TEST_NOTE"
            fi
          fi
          # Show the run's self-reported outcome on the PR, but NEVER trust it: the log
          # is written inside the agent job, so a prompt-injected agent could claim
          # PASS/APPROVE. Values are reduced to known words (anything else is
          # "unknown") only to keep injection out of the PR text. Factory PRs are
          # therefore ALWAYS drafts; a human marks one ready after reviewing the diff
          # (and, until CI runs on factory PRs, after checking the app's CI by hand).
          LOGLINE="$(git show "refs/heads/$BRANCH:.factory/runs/run-${{ github.run_id }}.json" 2>/dev/null | tail -n 1 || true)"
          TEST_RESULT="$(printf %s "$LOGLINE" | jq -r '.test_result // "unknown"' 2>/dev/null || echo unknown)"
          VERDICT="$(printf %s "$LOGLINE" | jq -r '.review_verdict // "unknown"' 2>/dev/null || echo unknown)"
          case "$TEST_RESULT" in PASS|FAIL|none) ;; *) TEST_RESULT=unknown ;; esac
          case "$VERDICT" in APPROVE|"REQUEST CHANGES"|BLOCK) ;; *) VERDICT=unknown ;; esac
          # The brief is user text: show it as plain text in a code fence (no mentions, links or
          # images), with backticks removed so it cannot close the fence.
          BRIEF_NOTE="$(printf '```\n%s\n```' "$(printf %s "$BRIEF" | tr -d '`')")"
          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" \
            push -u origin "$BRANCH"
          # No `|| true`: if PR creation fails, the run fails.
          PR_URL="$(gh pr create --repo "$GITHUB_REPOSITORY" \
            --head "$BRANCH" --base develop --draft \
            --title "Factory: $(printf %s "$BRIEF" | tr '\n' ' ' | cut -c1-70 | iconv -c -f UTF-8 -t UTF-8)" \
            --body "Opened by D3 Factory run ${{ github.run_id }}.

          Brief:
          ${BRIEF_NOTE}

          Self-reported by the factory run (UNVERIFIED, written by the same agents that made the change):
          Tests: ${TEST_RESULT} | Factory reviewer verdict: ${VERDICT}

          Opened as a DRAFT. Review the diff yourself and run the app's CI before marking it ready.

          ${WARN_NOTE}

          Review the diff, then merge to develop (Vercel deploys develop to develop.clyintel). Promote develop to main for production.")"
          echo "Opened $PR_URL"
          log_run_record
          # Best-effort Slack notice with the real PR link (never fails the run).
          if [ -n "$SLACK_BOT_TOKEN" ] && [ -n "$SLACK_CHANNEL" ]; then
            curl -s -X POST https://slack.com/api/chat.postMessage \
              -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
              -H "Content-Type: application/json; charset=utf-8" \
              -d "$(jq -n --arg c "$SLACK_CHANNEL" \
                     --arg t "🔀 PR opened for review: $PR_URL (DRAFT; self-reported tests: $TEST_RESULT, reviewer: $VERDICT) — merge it to develop to deploy to dev (develop.clyintel); promote develop to main for production." \
                     '{channel:$c, text:$t}')" || true
          fi

  # If either job fails (e.g. publish REFUSES a push because commits touch protected paths),
  # the person who ran /d3 was already told "a pull request is being opened". Say that it
  # failed. Fixed message only: it never includes the brief or the offending paths.
  notify-failure:
    needs: [prepare, pipeline, publish]
    if: ${{ always() && (needs.prepare.result == 'failure' || needs.pipeline.result == 'failure' || needs.publish.result == 'failure' || needs.pipeline.result == 'skipped' || needs.pipeline.result == 'cancelled' || needs.publish.result == 'cancelled') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Tell Slack the run failed
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ github.event.client_payload.channel }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PREPARE_RESULT: ${{ needs.prepare.result }}
          PIPELINE_RESULT: ${{ needs.pipeline.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          RUN_LOG_SHEET_WEBHOOK: ${{ secrets.RUN_LOG_SHEET_WEBHOOK }}
          SHEET_LOGGED: ${{ needs.publish.outputs.sheet_logged }}
          BRIEF: ${{ github.event.client_payload.brief || inputs.brief }}
          ACTOR: ${{ github.event.client_payload.user || github.actor }}
        run: |
          # A run that started but did not get a record to the Sheet (the agent job failed or was
          # cancelled, or publish refused it before sending one) still gets a row. Built ONLY from
          # workflow values, never from anything the agents wrote: the outcome fields are fixed. Turns
          # and cost are NOT known here (the real figure is in the agent job's "pipeline failed: …, $X"
          # log line), so they are sent as null, not 0: a 0 would under-report spend in the Sheet.
          # Same keys run-log.mjs writes.
          if [ -n "$RUN_LOG_SHEET_WEBHOOK" ] && [ "$SHEET_LOGGED" != "true" ] \
             && [ "$PREPARE_RESULT" != "failure" ] && [ "$PIPELINE_RESULT" != "skipped" ]; then
            if [ "$PIPELINE_RESULT" = "success" ]; then STAGE="publish $PUBLISH_RESULT"; else STAGE="agent job $PIPELINE_RESULT"; fi
            TRIMMED="$(jq -rn --arg b "$BRIEF" '$b | sub("^\\s+"; "") | sub("\\s+$"; "")')"
            REC="$(jq -cn --arg run "$GITHUB_RUN_ID" --arg actor "$ACTOR" --arg repo "$GITHUB_REPOSITORY" \
                     --arg sha "$(printf %s "$TRIMMED" | sha256sum | cut -c1-12)" --arg brief "$TRIMMED" \
                     --arg ts "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" --arg stage "$STAGE" \
                     '{ts:$ts, run_id:$run, branch:("factory/run-" + $run), actor:$actor, brief_sha256:$sha,
                       brief_chars:($brief | length), plan_title:("(run failed: " + $stage + ")"),
                       test_result:"none", review_verdict:"unknown", repo:$repo,
                       num_turns:null, total_cost_usd:null, guard_denials:0}')"
            curl -s -f -m 10 -X POST -H "Content-Type: application/json" --data-binary "$REC" "$RUN_LOG_SHEET_WEBHOOK" >/dev/null \
              || echo "Run-log Sheet webhook did not accept the record (continuing)."
          fi
          if [ -z "$SLACK_BOT_TOKEN" ] || [ -z "$SLACK_CHANNEL" ]; then
            echo "No Slack token/channel configured; nothing to notify."
            exit 0
          fi
          if [ "$PREPARE_RESULT" = "failure" ]; then
            MSG="❌ D3 Factory could not resolve the develop branch, so nothing ran. See $RUN_URL"
          elif [ "$PIPELINE_RESULT" = "skipped" ]; then
            MSG="⏸️ D3 Factory is switched off (the repository variable D3_FACTORY_ENABLED is not 'true', or the run was not started from main), so nothing ran."
          elif [ "$PIPELINE_RESULT" = "cancelled" ] || [ "$PUBLISH_RESULT" = "cancelled" ]; then
            MSG="⚠️ D3 Factory run was cancelled or timed out before finishing. No PR was opened. See $RUN_URL"
          elif [ "$PIPELINE_RESULT" = "success" ]; then
            MSG="❌ D3 Factory run failed while publishing (the push may have been refused, so no PR was opened). See $RUN_URL"
          else
            MSG="❌ D3 Factory run failed in the agent job. See $RUN_URL"
          fi
          curl -s -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "$(jq -n --arg c "$SLACK_CHANNEL" --arg t "$MSG" '{channel:$c, text:$t}')" || true
