name: CI

# Minimal CI: typecheck + tests on every PR into main or develop. The app lives
# in clyintel/, so the app job runs there. No secrets: STRIPE_TEST_SMOKE stays unset,
# so the env-gated Stripe test-mode smoke (lib/settlement/chargePathSmoke.test.ts)
# skips — the default suite is fully hermetic (no network, no real DB/Stripe).
#
# ready_for_review: the D3 Factory opens its draft PRs with GITHUB_TOKEN, and events
# caused by GITHUB_TOKEN start no workflows, so `opened` never runs CI on a factory PR.
# A person marking the draft ready does start workflows, so CI runs at hand-over.
on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, ready_for_review]

# Least privilege — CI only needs to read the checked-out code.
permissions:
  contents: read

# Supersede in-flight runs for the same PR/branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tsc + vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clyintel
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: clyintel/package-lock.json

      - name: Install (clean, from lockfile)
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npx vitest run

  # The D3 Factory's own suite (scripts/*.test.mjs): the guards, the publish checks and the
  # workflow invariants (one secret in the pipeline job, protected paths, vercel.json rules).
  # Needs only node, git, bash and jq, which ubuntu-latest has. The two real-container tests
  # skip unless D3_SANDBOX_TEST_IMAGE is set, so this job pulls no images. No path filter on
  # purpose: if this becomes a required check, a skipped job would sit at "pending" forever.
  factory:
    name: factory scripts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: scripts
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Install (clean, from lockfile)
        run: npm ci --no-audit --no-fund

      # GITHUB_RUN_ID is unset because run-log.mjs names the record after it, and the run-log
      # tests expect the local name (run-local.json), as when they run on a laptop.
      # A copy of the results goes to a TAP file, and every failing test becomes an error annotation
      # (name plus the first lines of its error), so a failure is readable from the PR's checks
      # without opening the full log. Test names come from this repo's own test files.
      - name: Test
        run: |
          set +e
          env -u GITHUB_RUN_ID node --test --test-reporter=tap --test-reporter-destination=stdout \
            --test-reporter=tap --test-reporter-destination="$RUNNER_TEMP/factory.tap" ./*.test.mjs
          RC=$?
          set -e
          if [ "$RC" -ne 0 ]; then
            awk '
              /^ *not ok / { if (msg) print msg; sub(/^ *not ok [0-9]+ - /, ""); msg = "::error title=factory test failed::" $0; n = 0; next }
              msg && n < 8 && /^ +(error|code|expected|actual|failureType):/ { gsub(/^ +/, ""); msg = msg "%0A" $0; n++ }
              END { if (msg) print msg }
            ' "$RUNNER_TEMP/factory.tap" || true
          fi
          exit "$RC"
